<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>学習計画</title>
<style>
:root{
  --bg:#F5F6F8; --card:#FFFFFF; --ink:#1B2430; --sub:#7A8494; --line:#E3E6EB;
  --math:#2F5BEA; --eng:#12867A; --phy:#7A4FD6; --sent:#D9822B;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#14181F; --card:#1D232C; --ink:#E9EDF3; --sub:#8D97A6; --line:#2B3340;
    --math:#7C9BFF; --eng:#4FC3B3; --phy:#B08CFF; --sent:#F0A860; }
}
:root[data-theme="dark"]{ --bg:#14181F; --card:#1D232C; --ink:#E9EDF3; --sub:#8D97A6; --line:#2B3340;
  --math:#7C9BFF; --eng:#4FC3B3; --phy:#B08CFF; --sent:#F0A860; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);touch-action:manipulation;
  font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif}
body{min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}
button:focus-visible{outline:2px solid var(--math);outline-offset:3px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 48px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;height:44px}
.cal-btn{width:44px;height:44px;display:grid;place-items:center;margin-left:-10px;color:var(--sub)}
.cal-btn svg{width:24px;height:24px}
.log-btn{height:36px;padding:0 11px;border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--sub)}
.log-btn:active{background:var(--line);color:var(--ink)}
.log-overlay{position:fixed;inset:0;z-index:30;display:none;justify-content:center;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 10px)}
.log-overlay.open{display:flex}
.log-panel{display:flex;flex-direction:column;width:100%;max-width:760px;min-height:0;height:100%;background:var(--bg)}
.log-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 0 12px}
.log-title{font-size:22px;font-weight:750}
.log-close{flex:none;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;font-size:28px;color:var(--sub)}
.log-search{width:100%;height:46px;flex:none;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-size:16px;outline:none;margin-bottom:10px}
.log-search:focus{border-color:var(--math)}
.log-count{flex:none;font-size:12px;color:var(--sub);padding:0 2px 6px}
.log-list{display:flex;flex:1;min-height:0;flex-direction:column;gap:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.log-item{display:grid;grid-template-columns:100px 1fr;gap:14px;padding:16px 2px;border-bottom:1px solid var(--line);font-size:15px;line-height:1.6}
.log-item:last-child{border-bottom:0}
.log-date{color:var(--sub);font-variant-numeric:tabular-nums}
.log-empty{font-size:14px;color:var(--sub);padding:22px 2px}
body.log-open{overflow:hidden}
.log-item{display:grid;grid-template-columns:82px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5}
.log-item:last-child{border-bottom:0}
.log-date{color:var(--sub);font-variant-numeric:tabular-nums}
.log-empty{font-size:14px;color:var(--sub);padding:18px 0}
.nav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px}
.arrow{width:56px;height:72px;font-size:40px;font-weight:200;color:var(--sub);line-height:1}
.arrow:active{color:var(--ink)}
.dateblock{text-align:center}
.date{font-size:40px;font-weight:700;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.date small{font-size:18px;font-weight:500;color:var(--sub);margin-left:6px}
.meta{margin-top:2px;font-size:14px;color:var(--sub)}
.today-link{display:block;margin:2px auto 0;font-size:13px;color:var(--math);height:24px}

/* tasks */
.list{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.task{background:var(--card);border-radius:14px;padding:14px 16px 14px 20px;position:relative;overflow:hidden}
.task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.task.has-note{background:color-mix(in srgb,#D9534F 7%,var(--card))}
.task-head{padding-right:22px}
.note-mark{position:absolute;right:10px;top:10px;font-size:13px;line-height:1}
.task-note{display:block;width:100%;min-height:34px;margin-top:9px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font-size:13px;font-weight:400;line-height:1.45;overflow-wrap:anywhere;white-space:pre-wrap;text-align:left}
.task-note-input{display:block;width:100%;height:34px;margin-top:9px;padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;font-weight:400;outline:none}
.task-note-input:focus{border-color:var(--math)}
.task-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.task-name{font-size:14px;font-weight:700;color:var(--c)}
.task-prog{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.line{display:flex;align-items:baseline;gap:10px;padding:3px 0;font-size:22px;font-weight:600;line-height:1.35}
.line .lbl{font-size:15px;font-weight:500;color:var(--sub);min-width:3.2em}
.line .rng{font-variant-numeric:tabular-nums}
.line .unit{font-size:15px;font-weight:500;color:var(--sub);margin-left:-6px}
.line .extra{font-size:15px;font-weight:500;color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:40px 0;font-size:16px}
.done{font-size:14px;color:var(--sub);padding:2px 0}

/* calendar */
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.45);display:none;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 56px) 16px 16px;z-index:10}
.overlay.open{display:flex}
.panel{background:var(--card);border-radius:16px;width:100%;max-width:380px;padding:14px 14px 16px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mhead .t{font-weight:700;font-size:17px}
.mhead button{width:44px;height:36px;font-size:24px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dow{font-size:12px;color:var(--sub);padding:4px 0}
.day{aspect-ratio:1;border-radius:10px;font-size:15px;position:relative;font-variant-numeric:tabular-nums;color:var(--sub)}
.day.in{color:var(--ink);background:color-mix(in srgb,var(--math) 8%,transparent)}
.day.today{box-shadow:inset 0 0 0 1.5px var(--math)}
.day.sel{background:var(--math);color:#fff}
.day.blank{pointer-events:none}
.hint{margin-top:10px;font-size:12px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="cal-btn" id="calBtn" aria-label="カレンダーを開く">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    </button>
    <button class="log-btn" id="logBtn" aria-label="変更履歴を開く">変更履歴</button>
  </div>

  <div class="nav">
    <button class="arrow" id="prev" aria-label="1日戻る">‹</button>
    <div class="dateblock">
      <div class="date" id="date"></div>
      <div class="meta" id="meta"></div>
    </div>
    <button class="arrow" id="next" aria-label="1日進む">›</button>
  </div>
  <button class="today-link" id="todayLink" hidden>今日に戻る</button>

  <div class="list" id="list"></div>
</div>

<div class="log-overlay" id="logOverlay">
  <section class="log-panel" role="dialog" aria-modal="true" aria-labelledby="logTitle">
    <div class="log-head">
      <div class="log-title" id="logTitle">変更履歴</div>
      <button class="log-close" id="logClose" aria-label="変更履歴を閉じる">×</button>
    </div>
    <input class="log-search" id="logSearch" type="search" placeholder="履歴を検索（日付・内容）" aria-label="変更履歴を検索" autocomplete="off">
    <div class="log-count" id="logCount" aria-live="polite"></div>
    <div class="log-list" id="logList"></div>
  </section>
</div>

<div class="overlay" id="overlay">
  <div class="panel" role="dialog" aria-label="カレンダー">
    <div class="mhead">
      <button id="mPrev" aria-label="前の月">‹</button>
      <div class="t" id="mTitle"></div>
      <button id="mNext" aria-label="次の月">›</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="hint">日付を押すと、その日の予定を表示します</div>
  </div>
</div>

<script>
/* ============ 設定(ここを編集する) ============ */
const TIMELINE_START = "2026-10-17"; // 全体の日数表示の基準日 (YYYY-MM-DD)

// segments: 順番にこなす教材。total は総量。
// days: 全体を何日で一周するか(量を均等割り) / perDay: 1日の固定量(余りは最終日)
// start: そのタスクの開始日(必須) / skip: 開始時点で終わっている量
const TASKS = [
  { name:"数学", color:"--math", days:60, start:"2026-10-15",
    segments:[
      { label:"数IA",  total:610, unit:"ページ" },
      { label:"数IIB", total:931, unit:"ページ" },
      { label:"数III", total:719, unit:"ページ" } ] },
  { name:"英文法", color:"--eng", days:25, start:"2026-10-17", skip:16,
    segments:[ { label:"英文法", total:219, unit:"ページ" } ] },
  { name:"最短物理", color:"--phy", days:15, start:"2026-10-17", skip:22,
    segments:[ { label:"最短物理", total:244, unit:"ページ" } ] },
  { name:"英文英単語Z", color:"--sent", perDay:3, start:"2026-10-15",
    segments:[ { label:"英文英単語Z", total:70, unit:"", extra:"＋ 付随する英単語" } ] }
];
/* ============================================== */

// 変更があったら新しいものを先頭に追加する（YYYY-MM-DD）
const CHANGELOG = [
  { date:"2026-10-17", text:"メモをSupabase共有保存に対応（接続設定が必要）。" },
  { date:"2026-10-17", text:"科目・日付ごとのメモと自動保存を追加。" },
  { date:"2026-10-17", text:"全科目の開始日を個別設定し、全体基準日と分離。" },
  { date:"2026-10-17", text:"変更履歴を開いた際の検索欄への自動フォーカスを解除。" },
  { date:"2026-10-17", text:"英文法の1〜16ページを完了扱いに設定。" },
  { date:"2026-10-17", text:"学習計画を今日開始に変更。英文法を25日間に調整。" }
];

/* 共有メモ設定: Supabase の Project URL と anon/public key を入力する */
const SUPABASE_URL = "https://YOUR_PROJECT.supabase.co";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
const CLOUD_NOTES_ENABLED =
  SUPABASE_URL.startsWith("https://") &&
  !SUPABASE_URL.includes("YOUR_PROJECT") &&
  SUPABASE_ANON_KEY.length > 20 &&
  !SUPABASE_ANON_KEY.includes("YOUR_SUPABASE_ANON_KEY");

const WD = ["日","月","火","水","木","金","土"];
const $ = id => document.getElementById(id);
const [SY,SM,SD] = TIMELINE_START.split("-").map(Number);
const utc = d => Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
const dayIndex = d => Math.round((utc(d) - Date.UTC(SY,SM-1,SD)) / 864e5);
const stripTime = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const same = (a,b) => utc(a) === utc(b);

const total = t => t.segments.reduce((a,s)=>a+s.total,0);
const skipOf = t => t.skip || 0;
const remain = t => total(t) - skipOf(t);
const daysOf = t => t.perDay ? Math.ceil(remain(t)/t.perDay) : t.days;
const offOf = t => { const [y,m,d] = t.start.split("-").map(Number); return Math.round((Date.UTC(y,m-1,d) - Date.UTC(SY,SM-1,SD))/864e5); };
const endOf = t => offOf(t) + daysOf(t);
const lastDay = Math.max(...TASKS.map(endOf));

function span(t, d){
  const T = remain(t), n = daysOf(t), k = skipOf(t);
  d -= offOf(t);
  if (d < 0 || d >= n) return null;
  let s, e;
  if (t.perDay){ s = d*t.perDay; e = Math.min(T, s+t.perDay); }
  else { s = Math.floor(T*d/n); e = Math.floor(T*(d+1)/n); }
  s += k; e += k;
  return e > s ? {s,e} : null;
}
function linesOf(t, d){
  const sp = span(t, d); if (!sp) return [];
  const out = []; let off = 0;
  for (const g of t.segments){
    const a = Math.max(sp.s, off), b = Math.min(sp.e, off+g.total);
    if (b > a) out.push({ label:g.label, from:a-off+1, to:b-off, unit:g.unit||"", extra:g.extra||"" });
    off += g.total;
  }
  return out;
}

let today = stripTime(new Date());
let view = today;
let calMonth = new Date(view.getFullYear(), view.getMonth(), 1);
let activeNote = null;
let noteDraft = "";
let notePressTimer = null;

const dateKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const noteKey = (task, d) => `kanshi-note:${dateKey(d)}:${task.name}`;
const sharedNotes = new Map();
let cloudNotesLoaded = false;
const readNote = key => {
  if (CLOUD_NOTES_ENABLED) return sharedNotes.get(key) || "";
  try { return localStorage.getItem(key) || ""; } catch { return ""; }
};
function cloudHeaders(extra = {}) {
  return { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}`, "Content-Type": "application/json", ...extra };
}
async function loadCloudNotes(showError = true){
  if (!CLOUD_NOTES_ENABLED) return;
  try {
    const response = await fetch(`${SUPABASE_URL}/rest/v1/kanshi_notes?select=note_date,task_name,content`, { headers: cloudHeaders(), cache: "no-store" });
    if (!response.ok) throw new Error(`共有メモの読み込みに失敗しました (${response.status})`);
    const rows = await response.json();
    const fresh = new Map(rows.map(row => [`kanshi-note:${row.note_date}:${row.task_name}`, row.content || ""]));
    // 編集中の入力を外部更新で上書きしない
    if (activeNote?.mode === "edit") fresh.set(activeNote.key, sharedNotes.get(activeNote.key) || "");
    sharedNotes.clear();
    for (const [key, value] of fresh) sharedNotes.set(key, value);
    cloudNotesLoaded = true;
    if (!activeNote || activeNote.mode !== "edit") render();
  } catch (error) {
    console.error(error);
    if (showError) alert("共有メモを読み込めませんでした。接続設定とSupabaseのテーブル設定を確認してください。");
  }
}
async function syncCloudNote(key, value, date, taskName){
  const query = `note_date=eq.${encodeURIComponent(date)}&task_name=eq.${encodeURIComponent(taskName)}`;
  try {
    let response;
    if (value) {
      response = await fetch(`${SUPABASE_URL}/rest/v1/kanshi_notes?on_conflict=note_date,task_name`, {
        method: "POST",
        headers: cloudHeaders({ Prefer: "resolution=merge-duplicates,return=minimal" }),
        body: JSON.stringify({ note_date: date, task_name: taskName, content: value })
      });
    } else {
      response = await fetch(`${SUPABASE_URL}/rest/v1/kanshi_notes?${query}`, {
        method: "DELETE",
        headers: cloudHeaders({ Prefer: "return=minimal" })
      });
    }
    if (!response.ok) throw new Error(`共有メモの保存に失敗しました (${response.status})`);
  } catch (error) {
    console.error(error);
    alert("共有メモを保存できませんでした。ネットワークとSupabaseの設定を確認してください。");
  }
}
function saveActiveNote(){
  if (!activeNote) return;
  const { key, date, taskName } = activeNote;
  const value = noteDraft.trim();
  if (CLOUD_NOTES_ENABLED) {
    if (value) sharedNotes.set(key, value); else sharedNotes.delete(key);
    syncCloudNote(key, value, date, taskName);
  } else {
    try { if (value) localStorage.setItem(key, value); else localStorage.removeItem(key); } catch {}
  }
  activeNote = null;
  noteDraft = "";
}
function openTaskNote(task, date){
  const key = noteKey(task, date);
  if (activeNote && activeNote.key === key) return;
  if (activeNote) saveActiveNote();
  const saved = readNote(key);
  activeNote = {key, mode: saved ? "view" : "edit", taskName: task.name, date: dateKey(date)};
  noteDraft = saved;
  render();
  if (activeNote && activeNote.mode === "edit") {
    const input = document.querySelector(".task-note-input");
    if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
  }
}
function beginNoteEdit(key){
  if (!activeNote || activeNote.key !== key) return;
  activeNote.mode = "edit";
  noteDraft = readNote(key);
  render();
  const input = document.querySelector(".task-note-input");
  if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
}

function render(){
  const d = dayIndex(view);
  $("date").innerHTML = `${view.getMonth()+1}/${view.getDate()}<small>(${WD[view.getDay()]})</small>`;
  const isToday = same(view, today);
  let meta;
  if (d < 0) meta = `開始前(${SM}/${SD}から)`;
  else if (d >= lastDay) meta = "全日程 終了";
  else meta = `${d+1}日目 / ${lastDay}日`;
  $("meta").textContent = (isToday ? "今日 ・ " : "") + meta;
  $("todayLink").hidden = isToday;

  const list = $("list"); list.innerHTML = "";
  let any = false;
  for (const t of TASKS){
    const ls = linesOf(t, d);
    if (!ls.length) continue;
    any = true;
    const n = daysOf(t);
    const el = document.createElement("div");
    const noteId = noteKey(t, view);
    const savedNote = readNote(noteId);
    const isActiveNote = activeNote && activeNote.key === noteId;
    el.className = "task" + (savedNote ? " has-note" : "");
    el.style.setProperty("--c", `var(${t.color})`);
    el.innerHTML = `<div class="task-head"><span class="task-name">${t.name}</span><span class="task-prog">${d-offOf(t)+1} / ${n}日目</span></div>` +
      (savedNote ? `<span class="note-mark" aria-hidden="true">⚠️</span>` : "") +
      ls.map(l => {
        const r = l.from === l.to ? `${l.from}` : `${l.from}〜${l.to}`;
        return `<div class="line"><span class="lbl">${l.label}</span><span class="rng">${r}</span>` +
          (l.unit ? `<span class="unit">${l.unit}</span>` : "") +
          (l.extra ? `<span class="extra">${l.extra}</span>` : "") + `</div>`;
      }).join("");
    if (isActiveNote) {
      if (activeNote.mode === "edit") {
        const input = document.createElement("input");
        input.className = "task-note-input";
        input.type = "text";
        input.maxLength = 500;
        input.setAttribute("aria-label", "メモ");
        input.value = noteDraft;
        input.addEventListener("input", () => { noteDraft = input.value; });
        input.addEventListener("keydown", e => {
          if (e.key === "Enter") { e.preventDefault(); saveActiveNote(); render(); }
          if (e.key === "Escape") { saveActiveNote(); render(); }
        });
        input.addEventListener("click", e => e.stopPropagation());
        el.appendChild(input);
      } else {
        const note = document.createElement("button");
        note.type = "button";
        note.className = "task-note";
        note.textContent = savedNote;
        note.setAttribute("aria-label", "メモ。1秒長押しで編集");
        note.addEventListener("click", e => e.stopPropagation());
        note.addEventListener("pointerdown", e => {
          if (e.pointerType === "mouse" && e.button !== 0) return;
          clearTimeout(notePressTimer);
          notePressTimer = setTimeout(() => beginNoteEdit(noteId), 1000);
        });
        const clearPress = () => { clearTimeout(notePressTimer); notePressTimer = null; };
        note.addEventListener("pointerup", clearPress);
        note.addEventListener("pointerleave", clearPress);
        note.addEventListener("pointercancel", clearPress);
        el.appendChild(note);
      }
    }
    el.addEventListener("click", () => openTaskNote(t, view));
    list.appendChild(el);
  }
  if (!any){
    list.innerHTML = `<div class="empty">${d < 0 ? "まだ開始前です" : "この日の予定はありません"}</div>`;
  } else {
    const finished = TASKS.filter(t => d >= endOf(t)).map(t => t.name);
    if (finished.length){
      const f = document.createElement("div");
      f.className = "done"; f.textContent = "一周済み: " + finished.join("・");
      list.appendChild(f);
    }
  }
}

document.addEventListener("click", e => {
  if (activeNote && !e.target.closest(".task")) {
    saveActiveNote();
    render();
  }
});

function shift(n){
  if (activeNote) saveActiveNote();
  view = new Date(view.getFullYear(), view.getMonth(), view.getDate()+n);
  render();
}
$("prev").onclick = () => shift(-1);
$("next").onclick = () => shift(1);
$("todayLink").onclick = () => { view = today; render(); };

/* 変更履歴 */
function renderLog(){
  const list = $("logList");
  const query = $("logSearch").value.trim().toLocaleLowerCase();
  list.innerHTML = "";
  const newestFirst = [...CHANGELOG].sort((a,b) => b.date.localeCompare(a.date));
  const filtered = newestFirst.filter(item =>
    (item.date + " " + item.text).toLocaleLowerCase().includes(query)
  );
  $("logCount").textContent = query ? `${filtered.length}件 / 全${CHANGELOG.length}件` : `${CHANGELOG.length}件`;
  if (!filtered.length){
    const empty = document.createElement("div");
    empty.className = "log-empty";
    empty.textContent = CHANGELOG.length ? "一致する履歴がありません。" : "まだ変更履歴はありません。";
    list.appendChild(empty);
    return;
  }
  for (const item of filtered){
    const row = document.createElement("div");
    row.className = "log-item";
    const date = document.createElement("div");
    date.className = "log-date";
    date.textContent = item.date;
    const detail = document.createElement("div");
    detail.textContent = item.text;
    row.append(date, detail);
    list.appendChild(row);
  }
}
let logScrollY = 0;
function openLog(){
  logScrollY = window.scrollY;
  document.body.classList.add("log-open");
  document.body.style.position = "fixed";
  document.body.style.top = `-${logScrollY}px`;
  document.body.style.width = "100%";
  $("logSearch").value = "";
  renderLog();
  $("logList").scrollTop = 0;
  $("logOverlay").classList.add("open");
}
function closeLog(){
  $("logOverlay").classList.remove("open");
  document.body.classList.remove("log-open");
  document.body.style.position = "";
  document.body.style.top = "";
  document.body.style.width = "";
  window.scrollTo(0, logScrollY);
}
$("logBtn").onclick = openLog;
$("logClose").onclick = closeLog;
$("logSearch").addEventListener("input", () => { renderLog(); $("logList").scrollTop = 0; });

/* カレンダー */
function renderCal(){
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  $("mTitle").textContent = `${y}年${m+1}月`;
  const g = $("grid"); g.innerHTML = WD.map(w=>`<div class="dow">${w}</div>`).join("");
  const first = new Date(y,m,1).getDay(), count = new Date(y,m+1,0).getDate();
  for (let i=0;i<first;i++) g.insertAdjacentHTML("beforeend",`<div class="day blank"></div>`);
  for (let day=1; day<=count; day++){
    const dt = new Date(y,m,day), idx = dayIndex(dt);
    const b = document.createElement("button");
    b.className = "day" + (idx>=0 && idx<lastDay ? " in":"") + (same(dt,today)?" today":"") + (same(dt,view)?" sel":"");
    b.textContent = day;
    b.onclick = () => { view = dt; render(); closeCal(); };
    g.appendChild(b);
  }
}
function openCal(){ calMonth = new Date(view.getFullYear(), view.getMonth(), 1); renderCal(); $("overlay").classList.add("open"); }
function closeCal(){ $("overlay").classList.remove("open"); }
$("calBtn").onclick = openCal;
$("overlay").onclick = e => { if (e.target === $("overlay")) closeCal(); };
$("mPrev").onclick = () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()-1, 1); renderCal(); };
$("mNext").onclick = () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 1); renderCal(); };
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeCal(); closeLog(); }
  if (!$("overlay").classList.contains("open")){
    if (e.key === "ArrowLeft") shift(-1);
    if (e.key === "ArrowRight") shift(1);
  }
});

/* 日付が変わったら自動で更新(「今日」を見ている場合のみ追従) */
function tick(){
  const now = stripTime(new Date());
  if (!same(now, today)){
    const following = same(view, today);
    today = now;
    if (following) view = now;
    render();
  }
}
setInterval(tick, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });

if (CLOUD_NOTES_ENABLED) {
  loadCloudNotes().finally(() => render());
  setInterval(() => { if (!document.hidden) loadCloudNotes(false); }, 30000);
} else {
  render();
}
</script>
